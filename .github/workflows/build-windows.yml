name: Build Windows Desktop App (.exe)

on:
  push:
    branches:
      - main
      - master
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      publish_release:
        description: 'Publish as GitHub Release'
        required: false
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-windows:
    name: Build Zeck Windows (.exe & .msi)
    runs-on: windows-latest
    env:
      CARGO_TERM_COLOR: always
      RUST_BACKTRACE: 1

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Setup Bun Runtime
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Setup Node.js 22 (for Tauri & Next.js tooling)
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Rust Stable Toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
          targets: x86_64-pc-windows-msvc

      - name: Cache Rust Dependencies
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/examples/desktop-app/src-tauri
          prefix-key: v1-rust
          add-job-id-key: true

      - name: Install Monorepo Dependencies
        shell: bash
        run: |
          echo "=== Installing Dependencies with Bun ==="
          bun install --frozen-lockfile || bun install

      # Topological build order: shared -> llms -> agents -> core -> ui
      - name: Build Shared UI & SDK (Strict Dependency Order)
        shell: bash
        run: |
          set -e
          echo "=== 1. Building @cline/shared ==="
          bun -F @cline/shared build

          echo "=== 2. Building @cline/llms ==="
          bun -F @cline/llms build

          echo "=== 3. Building @cline/agents ==="
          bun -F @cline/agents build

          echo "=== 4. Building @cline/core ==="
          bun -F @cline/core build

          echo "=== 5. Building @cline/ui ==="
          bun -F @cline/ui build

      - name: Verify Webview Import Artifacts
        shell: bash
        run: |
          echo "Verifying generated browser & node bundles..."
          for pkg in shared llms agents core ui; do
            if [ -d "sdk/packages/$pkg/dist" ]; then
              echo "✓ sdk/packages/$pkg/dist exists"
            elif [ -d "Zeck-main/sdk/packages/$pkg/dist" ]; then
              echo "✓ Zeck-main/sdk/packages/$pkg/dist exists"
            else
              echo "! Warning: dist directory for $pkg not found"
            fi
          done

      - name: Package Zeck Windows Desktop App (.exe & .msi)
        shell: bash
        run: |
          echo "=== Running Tauri Desktop Packaging ==="
          if [ -f "scripts/package-desktop.ts" ]; then
            bun run package:desktop:windows
          elif [ -d "apps/examples/desktop-app" ]; then
            cd apps/examples/desktop-app && (bun run package:desktop:windows || bun run build:binary)
          else
            bun run package:desktop:windows || bun run tauri build
          fi

      - name: Upload Windows Installer (.exe & .msi) Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Zeck-Windows-Installer
          path: |
            apps/examples/desktop-app/dist/desktop/*.exe
            apps/examples/desktop-app/dist/desktop/*.msi
            apps/examples/desktop-app/src-tauri/target/release/bundle/nsis/*.exe
            apps/examples/desktop-app/src-tauri/target/release/bundle/msi/*.msi
            apps/examples/desktop-app/src-tauri/target/release/*.exe
            dist/desktop/*.exe
            dist/desktop/*.msi
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/msi/*.msi
            src-tauri/target/release/*.exe
          if-no-files-found: warn
          retention-days: 14

      - name: Create GitHub Release (if tag or workflow_dispatch release)
        if: startsWith(github.ref, 'refs/tags/v') || github.event.inputs.publish_release == 'true'
        uses: softprops/action-gh-release@v2
        with:
          name: Zeck Desktop ${{ github.ref_name }}
          draft: false
          prerelease: false
          files: |
            apps/examples/desktop-app/dist/desktop/*.exe
            apps/examples/desktop-app/dist/desktop/*.msi
            apps/examples/desktop-app/src-tauri/target/release/bundle/nsis/*.exe
            apps/examples/desktop-app/src-tauri/target/release/bundle/msi/*.msi
            dist/desktop/*.exe
            dist/desktop/*.msi
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/msi/*.msi
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
