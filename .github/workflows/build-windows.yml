name: Build Zeck Windows (.exe & .msi)

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  pull_request:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-windows:
    name: Build Zeck Windows (.exe & .msi)
    runs-on: windows-latest
    permissions:
      contents: write
      pull-requests: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Setup Bun Runtime
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Setup Rust Stable
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
          targets: x86_64-pc-windows-msvc

      - name: Cache Rust Dependencies
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/examples/desktop-app/src-tauri
          prefix-key: v1-rust
          add-job-id-key: true

      - name: Install Monorepo Dependencies
        shell: bash
        run: |
          bun install --frozen-lockfile || bun install

      # Topological build order: shared -> llms -> core -> ui
      - name: Build Shared Packages (Strict Dependency Order)
        shell: bash
        run: |
          set -e
          echo "=== Building @cline/shared ==="
          bun -F @cline/shared build

          echo "=== Building @cline/llms ==="
          bun -F @cline/llms build

          echo "=== Building @cline/core ==="
          bun -F @cline/core build

          echo "=== Building @cline/ui ==="
          bun -F @cline/ui build

      - name: Verify Webview Imports
        shell: pwsh
        run: |
          Write-Host "Verifying built dist files for @cline/llms/browser..."
          if (Test-Path "./sdk/packages/llms/dist") {
            Get-ChildItem -Path "./sdk/packages/llms/dist" -Recurse
          } else {
            Write-Host "Checking alternate packages directory..."
            Get-ChildItem -Path "./Zeck-main/sdk/packages/llms/dist" -ErrorAction SilentlyContinue
          }

      - name: Package Windows Desktop App (.exe & .msi)
        shell: bash
        run: |
          bun run package:desktop:windows

      - name: Upload Windows Installers
        uses: actions/upload-artifact@v4
        with:
          name: zeck-windows-installer
          path: |
            apps/examples/desktop-app/src-tauri/target/release/bundle/msi/*.msi
            apps/examples/desktop-app/src-tauri/target/release/bundle/nsis/*.exe
            apps/examples/desktop-app/src-tauri/target/release/*.exe
          if-no-files-found: warn

      - name: Create GitHub Release (Tags Only)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            apps/examples/desktop-app/src-tauri/target/release/bundle/msi/*.msi
            apps/examples/desktop-app/src-tauri/target/release/bundle/nsis/*.exe
          draft: false
          prerelease: false
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
