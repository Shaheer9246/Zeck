name: Build Windows Desktop App (.exe)

on:
  push:
    branches:
      - main
      - master
    tags:
      - 'v*'
    paths-ignore:
      - '**.md'
      - '.gitignore'
  workflow_dispatch:
    inputs:
      publish_release:
        description: 'Publish as GitHub Release'
        required: false
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  build-windows:
    name: Build Zeck Windows (.exe & .msi)
    runs-on: windows-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Setup Node.js (for Tauri & Next.js tooling)
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Rust Toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/examples/desktop-app/src-tauri

      - name: Install Monorepo Dependencies
        run: |
          bun install

      - name: Build Shared UI & SDK
        run: |
          bun -F @cline/ui build
          bun -F @cline/shared build

      - name: Package Zeck Windows Desktop App (.exe & .msi)
        working-directory: apps/examples/desktop-app
        run: |
          bun run package:desktop:windows

      - name: Upload Windows Installer (.exe & .msi) Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Zeck-Windows-Installer
          path: |
            apps/examples/desktop-app/dist/desktop/*.exe
            apps/examples/desktop-app/dist/desktop/*.msi
          if-no-files-found: error
          retention-days: 14

      - name: Create GitHub Release (if tag or workflow_dispatch release)
        if: startsWith(github.ref, 'refs/tags/v') || github.event.inputs.publish_release == 'true'
        uses: softprops/action-gh-release@v2
        with:
          name: Zeck Desktop ${{ github.ref_name }}
          draft: false
          prerelease: false
          files: |
            apps/examples/desktop-app/dist/desktop/*.exe
            apps/examples/desktop-app/dist/desktop/*.msi
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

